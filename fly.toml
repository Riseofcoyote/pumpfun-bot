# Fly.io app for the filtered pump.fun bot. Runs one always-on machine.
# Do NOT add [http_service]: the bot has no web server, and Fly would stop the
# machine whenever no web traffic arrives.
app = "pumpfun-bot-w1afdq"
primary_region = "ewr"

[build]

[[mounts]]
  source = "bot_data"
  destination = "/data"
  initial_size = "1gb"   # Fly creates this volume automatically on first deploy

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  TRENDING_DATA_DIR = "/data/trades/trending"
  DEVWATCH_DATA_DIR = "/data/trades/devwatch"
  PAPER_SIZE_SOL = "0.2"

# Two paper-only testers (src/trending, src/devwatch); if either exits, the
# machine restarts both. src/kolwatch is retired (copying KOL buys lost money). Neither spends SOL or loads the wallet. To go back to the new-coin sniper, use:
#   app = "sh -c 'mkdir -p /data/trades /data/logs && exec uv run --no-sync pump_bot'"
[processes]
  app = "bash -c 'mkdir -p /data/trades/trending /data/trades/devwatch /data/logs && cd /app/src && /app/.venv/bin/python -m trending.engine & cd /app/src && /app/.venv/bin/python -m devwatch.engine & wait -n; exit 1'"

# The bot exits with code 0 if its trading process stops, and Fly's default
# (on-failure) does not restart on code 0. Always restart instead.
[[restart]]
  policy = "always"
  retries = 10
  processes = ["app"]
