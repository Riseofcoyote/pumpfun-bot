# Fly.io app for the filtered pump.fun bot. Runs one always-on machine.
# Do NOT add [http_service]: the bot has no web server, and Fly would stop the
# machine whenever no web traffic arrives.
app = "pumpfun-bot-w1afdq"
primary_region = "ewr"

[build]

[[mounts]]
  source = "bot_data"
  destination = "/data"
  initial_size = "1gb"   # Fly creates this volume automatically on first deploy

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[processes]
  app = "sh -c 'mkdir -p /data/trades /data/logs && exec uv run --no-sync pump_bot'"
