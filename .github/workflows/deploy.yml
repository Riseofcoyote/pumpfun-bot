# Manual deploy of main to the Fly bot app. Needs repo secret FLY_API_TOKEN.
name: Deploy to Fly
on: workflow_dispatch
permissions:
  contents: read
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Stage SOLBOT_TOKEN (Solana paper bot's DASHBOARD_TOKEN) if the repo secret exists
        env:
          SOLBOT_TOKEN: ${{ secrets.SOLBOT_TOKEN }}
        if: env.SOLBOT_TOKEN != ''
        run: flyctl secrets set --stage --app pumpfun-bot-w1afdq SOLBOT_TOKEN="$SOLBOT_TOKEN"
      - run: flyctl deploy --remote-only --app pumpfun-bot-w1afdq
      - run: flyctl status --app pumpfun-bot-w1afdq
