# Manual read-only report on the live bot. Moves no funds, changes nothing.
# 1) On-chain: the bot's trades from the wallet's history, via the existing
#    SOLANA_NODE_RPC_ENDPOINT secret (bot trades = buys under 0.03 SOL).
# 2) Optional, if repo secret FLY_API_TOKEN exists: machine status, the trade
#    ledger and the bot log's gate decisions from the Fly volume.
# Never prints env or secrets.
name: Bot report
on: workflow_dispatch
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: pumpfun-bot-w1afdq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bot trades on-chain
        env:
          SOLANA_NODE_RPC_ENDPOINT: ${{ secrets.SOLANA_NODE_RPC_ENDPOINT }}
          WALLET: Et8w4DyfUkqMebyMj5iv7ugTKfDKjzTDJ2RPDVu8zsRp
        run: python tools/wallet_trades.py
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Machine status
        if: env.FLY_API_TOKEN != ''
        run: flyctl status -a "$APP" || true
      - name: Recent Fly logs
        if: env.FLY_API_TOKEN != ''
        run: timeout 60 flyctl logs -a "$APP" --no-tail | tail -400 || true
      - name: Real-trade ledger
        if: env.FLY_API_TOKEN != ''
        run: |
          flyctl ssh console -a "$APP" -C "sh -c 'cat /data/trades/ledger.csv 2>/dev/null || echo no ledger yet'" || true
      - name: Bot log - trades, gate decisions, errors
        if: env.FLY_API_TOKEN != ''
        run: |
          flyctl ssh console -a "$APP" -C "sh -c 'for f in \$(ls -t /data/logs/*.log | head -3); do echo \"=== \$f\"; grep -E \"ledger|gate|paper|Trading wallet|Wallet|Buy|Sell|buy|sell|Skip|skip|ERROR|WARNING|Exception\" \$f | tail -2500; done'" || true
      - name: Bot log - last 300 lines
        if: env.FLY_API_TOKEN != ''
        run: |
          flyctl ssh console -a "$APP" -C "sh -c 'tail -300 \$(ls -t /data/logs/*.log | head -1)'" || true
      - name: Trending paper engine - leaderboard and recent log
        if: env.FLY_API_TOKEN != ''
        run: |
          flyctl ssh console -a "$APP" -C "sh -c 'cat /data/trades/trending/leaderboard.txt; echo === CANDIDATES; cat /data/trades/trending/candidates.json; echo === TRADES; wc -l /data/trades/trending/trades.csv; echo === LOG; grep -aE \"WARNING|ERROR|evolve|CANDIDATE|migrate|status\" /data/trades/trending/engine.log | tail -80'" || true
      - name: Trending paper engine - full trade ledger
        if: env.FLY_API_TOKEN != ''
        run: |
          flyctl ssh console -a "$APP" -C "cat /data/trades/trending/trades.csv" || true
      - name: Dev watch - report, log highlights and results
        if: env.FLY_API_TOKEN != ''
        run: |
          flyctl ssh console -a "$APP" -C "sh -c 'cat /data/trades/devwatch/report.txt; echo === LOG; grep -a -E \"WARNING|ERROR|status|watchlist|signal\" /data/trades/devwatch/engine.log | tail -80; echo === RESULTS; cat /data/trades/devwatch/results.csv'" || true
      - name: KOL watch - report, log highlights and results
        if: env.FLY_API_TOKEN != ''
        run: |
          flyctl ssh console -a "$APP" -C "sh -c 'cat /data/trades/kolwatch/report.txt; echo === LOG; grep -a -E \"WARNING|ERROR|status|feed|following\" /data/trades/kolwatch/engine.log | tail -80; echo === RESULTS; cat /data/trades/kolwatch/results.csv'" || true
      - name: Narrative - report, log highlights and results
        if: env.FLY_API_TOKEN != ''
        run: |
          flyctl ssh console -a "$APP" -C "sh -c 'cat /data/trades/narrative/report.txt; echo === LOG; grep -a -E \"WARNING|ERROR|heat|status\" /data/trades/narrative/engine.log | grep -v signal | tail -60; echo === RESULTS; cat /data/trades/narrative/results.csv'" || true
