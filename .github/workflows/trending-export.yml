# Pulls the trending tester's paper trade logs and market snapshots off the Fly
# volume as a workflow artifact, for offline backtests. Read-only.
name: Trending export
on: workflow_dispatch
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          flyctl ssh console -a pumpfun-bot-w1afdq -C "sh -c 'cd /data/trades/trending && tar czf - trades*.csv state.json snapshots 2>/dev/null | base64 -w0'" > out.b64
          base64 -d out.b64 > trending-export.tgz
          tar tzvf trending-export.tgz | tail -20
          # One giant line is dropped from the job log; wrap it so it can be rebuilt by
          # joining the lines between the markers.
          echo "BEGIN_EXPORT"; fold -w 4000 out.b64; echo; echo "END_EXPORT"
      - uses: actions/upload-artifact@v4
        with:
          name: trending-export
          path: trending-export.tgz
          retention-days: 3
